<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#09090b" />
  <!-- Grid overlay -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="950" cy="200" r="300" fill="url(#grad)" />
  
  <!-- Content -->
  <g transform="translate(100, 140)">
    <!-- Badge -->
    <rect width="260" height="36" rx="18" fill="rgba(59, 130, 246, 0.1)" stroke="rgba(59, 130, 246, 0.3)" />
    <circle cx="20" cy="18" r="5" fill="#3b82f6" />
    <text x="35" y="23" font-family="monospace" font-size="14" font-weight="600" fill="#60a5fa">SOFTWARE ENGINEER</text>
    
    <!-- Title -->
    <text x="0" y="110" font-family="system-ui, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">Subhan Singandaru</text>
    
    <!-- Tagline -->
    <text x="0" y="170" font-family="system-ui, sans-serif" font-size="28" font-weight="400" fill="#a1a1aa">Engineering Scalable Software. Exploring Intelligent Systems.</text>
    
    <!-- Badges -->
    <g transform="translate(0, 240)">
      <rect width="140" height="40" rx="8" fill="#18181b" stroke="#27272a" />
      <text x="70" y="25" font-family="monospace" font-size="14" fill="#e4e4e7" text-anchor="middle">React / Next.js</text>
      
      <rect x="155" width="130" height="40" rx="8" fill="#18181b" stroke="#27272a" />
      <text x="220" y="25" font-family="monospace" font-size="14" fill="#e4e4e7" text-anchor="middle">NestJS / Node</text>

      <rect x="300" width="130" height="40" rx="8" fill="#18181b" stroke="#27272a" />
      <text x="365" y="25" font-family="monospace" font-size="14" fill="#e4e4e7" text-anchor="middle">Apache Kafka</text>

      <rect x="445" width="140" height="40" rx="8" fill="#18181b" stroke="#27272a" />
      <text x="515" y="25" font-family="monospace" font-size="14" fill="#e4e4e7" text-anchor="middle">AI Engineering</text>
    </g>
    
    <!-- Footer -->
    <text x="0" y="360" font-family="monospace" font-size="16" fill="#71717a">github.com/subhan-sd • Bogor, Indonesia</text>
  </g>
</svg>
